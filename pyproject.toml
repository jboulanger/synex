[project]
name = "synxm"
version = "0.1.0"
description = "Synaptic marker analysis for expansion microscopy"
readme = "README.md"
authors = [{ name = "jboulanger", email = "jerome.boulanger@laposte.net" }]
requires-python = ">=3.13"
dependencies = [
    "bioio>=3.6.0",
    "bioio-czi>=3.0.1",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "napari[pyqt6]>=0.6.5",
    "numpy>=2.5.4",
    "pandas>=2.0.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[project.scripts]
synxm = "synxm.__main__:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[dependency-groups]
dev = ["ruff>=0.17.1", "pytest"]
